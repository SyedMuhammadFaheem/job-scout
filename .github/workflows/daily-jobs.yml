name: Daily job radar

on:
  schedule:
    # 9:00 AM Asia/Karachi (UTC+5, no DST) = 04:00 UTC
    - cron: "0 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Write config and profile from secrets
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
          PROFILE_JSON: ${{ secrets.PROFILE_JSON }}
        run: |
          printf '%s' "$CONFIG_JSON" > config.json
          printf '%s' "$PROFILE_JSON" > profile.json
          python -c "import json; json.load(open('config.json')); json.load(open('profile.json'))"

      - name: Run pipeline
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python -m src.pipeline

      - name: Persist job database
        run: |
          if ! git diff --quiet -- data/jobs.db; then
            git config user.name "job-scout-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/jobs.db
            git commit -m "chore: update job database [skip ci]"
            git push
          fi
